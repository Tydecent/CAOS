[package]
name = "caos-ca"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "CAOS: an air-gapped certificate authority management tool"
license = "MIT OR Apache-2.0"

[dependencies]
argon2 = { version = "0.5.3", features = ["zeroize"] }
chacha20poly1305 = "0.10.1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4.3"
hex = "0.4"
libc = "0.2"
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring", "x509-parser", "zeroize"] }
ring = "0.17"
rpassword = "7.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.8"
x509-parser = { version = "0.18.1", features = ["verify"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
