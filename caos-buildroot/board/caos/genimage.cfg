# CAOS SD-card layout: pure GPT, no hybrid MBR and no BIOS boot code.
#
# p1 is a standards-compliant EFI System Partition (GPT type C12A7328-...),
# not merely a FAT partition.  The FAT image is prepared by post-image.sh and
# contains \EFI\BOOT\BOOTX64.EFI, the UEFI removable-media default path.
#
# The GPT names CAOSBOOT/CAOSROOT/CAOSDATA are part of the operating contract:
# the kernel finds its root with root=PARTLABEL=CAOSROOT, and S10caos-data finds
# the not-yet-formatted LUKS partition with PARTLABEL=CAOSDATA.
#
# No partition carries the legacy BIOS bootable flag; UEFI firmware does not use
# it.  boot.vfat, rootfs.squashfs and bzImage are prepared before genimage runs.

image sdcard.img {
    hdimage {
        partition-table-type = "gpt"
        align = 1M
    }

    partition CAOSBOOT {
        # EFI System Partition.  Keep this explicit rather than the generic
        # FAT32 basic-data type: firmware and operators both rely on it.
        partition-type-uuid = "C12A7328-F81F-11D2-BA4B-00A0C93EC93B"
        image = "boot.vfat"
    }

    partition CAOSROOT {
        partition-type-uuid = "L"
        image = "rootfs.squashfs"
        size = 128M
    }

    # Empty on purpose.  The operator formats this as LUKS2 on first boot.
    partition CAOSDATA {
        partition-type-uuid = "L"
        size = 128M
    }
}
