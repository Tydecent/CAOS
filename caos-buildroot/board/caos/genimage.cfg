# CAOS SD-card layout.
#
# Hybrid MBR/GPT table:
#   - MBR makes the FAT32 partition bootable by the SYSLINUX MBR code.
#   - GPT carries the partition names CAOSBOOT/CAOSROOT/CAOSDATA so blkid and
#     findfs can locate the first-boot data partition before it has a LUKS
#     filesystem label.
#
# boot.vfat, rootfs.squashfs and zImage are prepared by post-image.sh.

image sdcard.img {
    hdimage {
        partition-table-type = "hybrid"
        align = 1M
    }

    partition CAOSBOOT {
        partition-type = 0x0c
        partition-type-uuid = "F"
        bootable = true
        image = "boot.vfat"
    }

    partition CAOSROOT {
        partition-type = 0x83
        partition-type-uuid = "L"
        image = "rootfs.squashfs"
        size = 128M
    }

    # Empty on purpose.  The operator formats this as LUKS2 on first boot.
    partition CAOSDATA {
        partition-type = 0x83
        partition-type-uuid = "L"
        size = 128M
    }
}
