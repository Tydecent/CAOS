# CAOS UEFI boot menu.  This file lives at \EFI\BOOT\grub.cfg on the ESP.
# The kernel is at the FAT root and the root filesystem is a squashfs in GPT
# partition CAOSROOT.  Keep ttyS0 last so /dev/console uses the serial port.
set timeout=10
set default=0
set gfxmode=1024x768,800x600,auto
set gfxpayload=keep

menuentry "CAOS - Local Console" {
    linux /zImage console=tty0 root=PARTLABEL=CAOSROOT rootfstype=squashfs ro rootwait
}

menuentry "CAOS - Serial Console (115200)" {
    linux /zImage console=ttyS0,115200 root=PARTLABEL=CAOSROOT rootfstype=squashfs ro rootwait
}
