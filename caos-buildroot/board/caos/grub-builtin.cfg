# Embedded into BOOTX64.EFI by grub-mkimage via
# BR2_TARGET_GRUB2_BUILTIN_CONFIG_EFI.  The ESP is found by its FAT volume
# label, not by a fixed (hdN,gpt1) number, so the image works whether the
# medium is the first, second, or only disk seen by the firmware.
search --no-floppy --label CAOSBOOT --set=root
set prefix=($root)/EFI/BOOT
configfile ($root)/EFI/BOOT/grub.cfg
